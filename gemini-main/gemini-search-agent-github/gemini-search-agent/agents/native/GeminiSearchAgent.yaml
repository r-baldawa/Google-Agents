  model: ''
  decoding_method: null
  prompt: null
  max_tokens: 4096
  max_completion_tokens: null
  temperature: 0.7
  top_p: null
  n: null
  stream: null
  logprobs: null
  top_logprobs: null
  echo: null
  stop: null
  presence_penalty: null
  frequency_penalty: null
  best_of: null
  logit_bias: null
  user: null
  context: null
