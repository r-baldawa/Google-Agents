name: virtual-model/google/gemini-3.1-pro-preview
display_name: Gemini 3.1 Pro Preview with Search
description: |-
  Google Gemini 3.1 Pro Preview model configured for use with Google Search grounding.

  This model provides advanced capabilities with the Gemini 3.1 Pro Preview model.
  When used with the Python SDK and Google Search grounding enabled, it provides:

  - Real-time web search integration for factually accurate responses
  - Automatic source citations and grounding metadata
  - Reduced hallucinations through web-based grounding
  - Access to current information and recent events
  - Advanced reasoning and analysis capabilities
  - Multi-turn conversations with context awareness
  - Support for complex queries and instructions

  Key Features:
  - Model: gemini-3.1-pro-preview
  - Provider: Google AI
  - Search Grounding: Enabled via Python SDK
  - Max Tokens: 4096 (configurable)
  - Temperature: 0.7 (balanced creativity and accuracy)

  Note: Google Search grounding must be enabled via the Python SDK using:
  config=types.GenerateContentConfig(
      tools=[types.Tool(google_search=types.GoogleSearch())]
  )

  This configuration is automatically handled by the search tools in this package.

  Requirements:
  - Valid Google API key with Gemini API access
  - google-genai Python package (>=0.2.0)
  - Configured google_credentials connection in Orchestrate

  Best for:
  - Current events and news queries
  - Fact-checking and verification
  - Research and information gathering
  - Real-time data retrieval
  - Questions requiring up-to-date information
provider: google
provider_config:
  provider: google
  # TODO: Replace with your Google API key
  # Get your API key from: https://aistudio.google.com/app/apikey
  api_key: YOUR_GOOGLE_API_KEY_HERE
tags:
- google
- genai
- gemini
- gemini-3.1
- preview
- grounding
- search
- real-time
- web-search
model_type: chat
model_name: virtual-model/google/gemini-3.1-pro-preview
config:
  model: gemini-3.1-pro-preview
app_id: google_credentials
spec_version: v1
kind: model
